apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity

metadata:
  name: mongodb

spec:
  members: 1

  type: ReplicaSet

  version: "7.0.5"

  security:
    authentication:
      modes: ["SCRAM"]

  users:
    - name: root
      db: admin

      passwordSecretRef:
        name: mongodb-password

      roles:
        - name: root
          db: admin

      scramCredentialsSecretName: mongodb-scram

  statefulSet:
    spec:
      template:
        spec:
          serviceAccountName: mongodb-database-sa
          tolerations:
            - key: "app"
              operator: "Equal"
              value: "db"
              effect: "NoSchedule"

      volumeClaimTemplates:
        - metadata:
            name: data-volume

          spec:
            accessModes:
              - ReadWriteOnce

            resources:
              requests:
                storage: 5Gi