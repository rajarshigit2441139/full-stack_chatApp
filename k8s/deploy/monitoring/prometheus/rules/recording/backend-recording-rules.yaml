apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: chatapp-backend-recording-rules
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: chatapp.backend
      interval: 30s

      rules:

        
         # ======================  Availability ====================== #
        

        - record: chatapp:backend_up
          expr: |
            max(
              up{
                namespace="back",
                service="backend-svc"
              }
            )


        
         # ======================  HTTP Traffic ====================== #
        

        - record: chatapp:backend_http_requests_per_second
          expr: |
            sum(
              rate(
                http_request_duration_seconds_count{
                  namespace="back"
                }[5m]
              )
            )

        - record: chatapp:backend_http_requests_per_second_by_method
          expr: |
            sum by (method) (
              rate(
                http_request_duration_seconds_count{
                  namespace="back"
                }[5m]
              )
            )

        - record: chatapp:backend_http_requests_per_second_by_status
          expr: |
            sum by (status_code) (
              rate(
                http_request_duration_seconds_count{
                  namespace="back"
                }[5m]
              )
            )


        
         # ======================  HTTP Errors ====================== #
        

        - record: chatapp:backend_http_4xx_requests_per_second
          expr: |
            sum(
              rate(
                http_request_duration_seconds_count{
                  namespace="back",
                  status_code=~"4.."
                }[5m]
              )
            )

        - record: chatapp:backend_http_5xx_requests_per_second
          expr: |
            sum(
              rate(
                http_request_duration_seconds_count{
                  namespace="back",
                  status_code=~"5.."
                }[5m]
              )
            )

        - record: chatapp:backend_http_5xx_error_percent
          expr: |
            100 *
            (
              sum(
                rate(
                  http_request_duration_seconds_count{
                    namespace="back",
                    status_code=~"5.."
                  }[5m]
                )
              )
              /
              clamp_min(
                sum(
                  rate(
                    http_request_duration_seconds_count{
                      namespace="back"
                    }[5m]
                  )
                ),
                0.000001
              )
            )


        
         # ======================  HTTP Latency ====================== #
        

        - record: chatapp:backend_http_latency_p50_seconds
          expr: |
            histogram_quantile(
              0.50,
              sum by (le) (
                rate(
                  http_request_duration_seconds_bucket{
                    namespace="back"
                  }[5m]
                )
              )
            )

        - record: chatapp:backend_http_latency_p95_seconds
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(
                  http_request_duration_seconds_bucket{
                    namespace="back"
                  }[5m]
                )
              )
            )

        - record: chatapp:backend_http_latency_p99_seconds
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(
                  http_request_duration_seconds_bucket{
                    namespace="back"
                  }[5m]
                )
              )
            )


        
         # ======================  WebSocket ====================== #
        

        - record: chatapp:backend_websocket_active_connections
          expr: |
            sum(
              websocket_active_connections{
                namespace="back"
              }
            )