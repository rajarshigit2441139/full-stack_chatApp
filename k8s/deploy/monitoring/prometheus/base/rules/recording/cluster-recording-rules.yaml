apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: chatapp-cluster-recording-rules
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: chatapp.cluster
      interval: 30s

      rules:
        - record: chatapp:cluster_cpu_usage_percent
          expr: |
            100 * (
              1 -
              avg(
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              )
            )

        - record: chatapp:cluster_memory_usage_percent
          expr: |
            100 * (
              1 -
              (
                sum(node_memory_MemAvailable_bytes)
                /
                sum(node_memory_MemTotal_bytes)
              )
            )

        - record: chatapp:cluster_nodes_total
          expr: |
            count(kube_node_info)

        - record: chatapp:cluster_nodes_ready
          expr: |
            sum(
              kube_node_status_condition{
                condition="Ready",
                status="true"
              }
            )

        - record: chatapp:cluster_nodes_not_ready
          expr: |
            sum(
              kube_node_status_condition{
                condition="Ready",
                status=~"false|unknown"
              }
            )

        - record: chatapp:cluster_running_pods
          expr: |
            sum(
              kube_pod_status_phase{phase="Running"}
            )

        - record: chatapp:cluster_pending_pods
          expr: |
            sum(
              kube_pod_status_phase{phase="Pending"}
            )

        - record: chatapp:cluster_failed_pods
          expr: |
            sum(
              kube_pod_status_phase{phase="Failed"}
            )

        - record: chatapp:cluster_not_ready_pods
          expr: |
            sum(
              max by (namespace, pod) (
                kube_pod_status_ready{condition="true"} == 0
              )
            )

        - record: chatapp:cluster_container_restarts_1h
          expr: |
            sum(
              increase(
                kube_pod_container_status_restarts_total[1h]
              )
            )