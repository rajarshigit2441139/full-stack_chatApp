apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: aws-secrets-manager

spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1

      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secret
            namespace: external-secrets
            key: access-key

          secretAccessKeySecretRef:
            name: aws-secret
            namespace: external-secrets
            key: secret-access-key