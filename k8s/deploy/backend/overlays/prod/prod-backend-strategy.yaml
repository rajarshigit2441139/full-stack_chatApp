apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
spec:
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 40
        - pause:
            duration: 60s
        - setWeight: 60
        - pause: {}
        - setWeight: 80
        - pause: {}
        - setWeight: 100