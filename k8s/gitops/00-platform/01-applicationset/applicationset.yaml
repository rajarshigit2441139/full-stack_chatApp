apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: platform
  namespace: argocd

spec:
  goTemplate: true

  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: platform-stage
              operator: In
              values:
                - core

        - matchExpressions:
            - key: platform-stage
              operator: In
              values:
                - alertmanager

  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          {{ if eq .name "prometheus" }}
          - ServerSideApply=true
          - DisableClientSideApplyMigration=true
          {{ end }}

      {{ if eq .name "alertmanager" }}
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .path }}'
      {{ else }}
      sources:
        # Helm chart
        - repoURL: '{{ .repoURL }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .version }}'

          helm:
            releaseName: '{{ .releaseName }}'
            valueFiles:
              - $values/k8s/gitops/00-platform/01-applicationset/{{ .valuesFile }}

        # Git repository containing values files
        - repoURL: 'https://github.com/rajarshigit2441139/full-stack_chatApp.git'
          targetRevision: k8s
          ref: values
      {{ end }}

  generators:
    - list:
        elements:

          - name: aws-load-balancer-controller
            stage: core
            namespace: kube-system
            repoURL: https://aws.github.io/eks-charts
            chart: aws-load-balancer-controller
            version: "3.4.3"
            releaseName: aws-load-balancer-controller
            valuesFile: values/patch-aws-load-balancer-controller.yaml

          - name: argo-rollouts
            stage: core
            namespace: argo-rollouts
            repoURL: https://argoproj.github.io/argo-helm
            chart: argo-rollouts
            version: "2.40.5"
            releaseName: argo-rollouts
            valuesFile: values/patch-argo-rollout.yaml

          # - name: mongodb-operator
          #   namespace: mongodb-operator
          #   repoURL: https://mongodb.github.io/helm-charts
          #   chart: community-operator
          #   version: "0.13.0"
          #   releaseName: mongodb-operator
          #   valuesFile: values/patch-mongodb-operator.yaml

          - name: prometheus
            stage: core
            namespace: monitoring
            repoURL: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            version: "87.12.2"
            releaseName: monitoring
            valuesFile: values/patch-observability.yaml

          - name: alertmanager
            stage: alertmanager
            namespace: monitoring
            repoURL: https://github.com/rajarshigit2441139/full-stack_chatApp.git
            targetRevision: k8s
            path: k8s/gitops/00-platform/02-alertmanager

  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
      labels:
        platform-stage: '{{ .stage }}'

    spec:
      project: platform-staging
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: analysisruns.argoproj.io
          jqPathExpressions:
            - '.spec.conversion | select(. == {"strategy":"None"})'
            - '.spec.preserveUnknownFields | select(. == false)'

        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: analysistemplates.argoproj.io
          jqPathExpressions:
            - '.spec.conversion | select(. == {"strategy":"None"})'
            - '.spec.preserveUnknownFields | select(. == false)'

        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: clusteranalysistemplates.argoproj.io
          jqPathExpressions:
            - '.spec.conversion | select(. == {"strategy":"None"})'
            - '.spec.preserveUnknownFields | select(. == false)'

        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: experiments.argoproj.io
          jqPathExpressions:
            - '.spec.conversion | select(. == {"strategy":"None"})'
            - '.spec.preserveUnknownFields | select(. == false)'

        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: rollouts.argoproj.io
          jqPathExpressions:
            - '.spec.conversion | select(. == {"strategy":"None"})'
            - '.spec.preserveUnknownFields | select(. == false)'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'

      # syncPolicy:
      #   automated:
      #     prune: true
      #     selfHeal: true

      #   syncOptions:
      #     - CreateNamespace=true
