apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alertmanager-gmail
  namespace: monitoring

spec:
  provider: aws

  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "chatapp/monitoring/alertmanager/gmail"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: username
          - path: password
            objectAlias: password

  secretObjects:
    - secretName: alertmanager-gmail
      type: Opaque
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password