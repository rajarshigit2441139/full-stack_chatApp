apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-staging
  namespace: argocd

spec:
  project: application-staging

  source:
    repoURL: https://github.com/rajarshigit2441139/full-stack_chatApp.git
    targetRevision: k8s
    path: k8s/gitops/50-applications/53-frontend/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: front

  syncPolicy:
    automated:
      prune: true
      selfHeal: true