apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mongodb-staging
  namespace: argocd

spec:
  project: application-staging

  source:
    repoURL: https://github.com/rajarshigit2441139/full-stack_chatApp.git
    targetRevision: k8s
    path:  k8s/gitops/50-applications/51-mongodb/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: db

  syncPolicy:
    automated:
      prune: true
      selfHeal: true