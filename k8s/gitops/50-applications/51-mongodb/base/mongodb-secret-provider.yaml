apiVersion: secrets-store.csi.x-k8s.io/v1 
kind: SecretProviderClass 
metadata: 
  name: mongodb-secret
  namespace: db
spec: 
  provider: aws 
  parameters: 
    usePodIdentity: "true"
    objects: |
      - objectName: "chatapp/stage/db"
        objectType: "secretsmanager"
        jmesPath:
        - path: username
          objectAlias: username
        - path: password
          objectAlias: password

secretObjects:
  - secretName: mongodb-password
    type: Opaque
    data:
      - objectName: password
        key: password