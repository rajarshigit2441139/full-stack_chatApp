apiVersion: v1
kind: Pod
metadata:
  name: mongodb-secret-sync
  namespace: db
spec:
  containers:
    - name: secret-sync
      image: public.ecr.aws/docker/library/busybox:1.36
      command:
        - /bin/sh
        - -c
        - "sleep infinity"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: mongodb-secrets
          mountPath: /mnt/secrets-store
          readOnly: true

  volumes:
    - name: mongodb-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: mongodb-secret