apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secrets
  namespace: back
  labels:
    used-by: backend
    app: backend
    stage: staging
spec:
  provider: aws

  parameters:
    usePodIdentity: "true"

    objects: |
      - objectName: "chatapp/stage/backend"
        objectType: "secretsmanager"
        jmesPath:
          - path: jwt-secret
            objectAlias: jwt-secret

  secretObjects:
    - secretName: backend-secrets
      type: Opaque
      data:
        - objectName: jwt-secret
          key: jwt-secret