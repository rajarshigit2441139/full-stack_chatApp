global:
  nodeSelector:
    app: platform

  tolerations:
  - key: app
    operator: Equal
    value: platform
    effect: NoSchedule

controller:
  nodeSelector:
    app: platform

  tolerations:
  - key: app
    operator: Equal
    value: platform
    effect: NoSchedule

server:
