ingress-nginx:
  name: ingress-nginx
  url: https://kubernetes.github.io/ingress-nginx
  namespace: ingress-nginx
  release: ingress-nginx
  chart: ingress-nginx/ingress-nginx
  version: 4.15.1
  createNamespace: true
  valuesFile: yaml_config/patch-ingress.yaml

argorollout:
  name: argo
  url: https://argoproj.github.io/argo-helm
  namespace: argo-rollouts
  release: argo-rollouts
  chart: argo/argo-rollouts
  version: 2.40.5 
  createNamespace: true
  valuesFile: yaml_config/patch-argo-rollout.yaml

argocd:
  name: argo
  url: https://argoproj.github.io/argo-helm
  namespace: argocd
  release: argocd
  chart: argo/argo-cd
  version: 10.1.3
  createNamespace: true
  valuesFile: yaml_config/patch-argocd.yaml

prometheus:
  name: prometheus-community
  url: https://prometheus-community.github.io/helm-charts
  namespace: monitoring
  release: monitoring
  chart: prometheus-community/kube-prometheus-stack
  version: 87.12.2
  createNamespace: true
  valuesFile: yaml_config/patch-observability.yaml

external-secrets:
  name: external-secrets
  url: https://charts.external-secrets.io
  namespace: external-secrets
  release: external-secrets
  chart: external-secrets/external-secrets
  version: 2.7.0
  createNamespace: true
  valuesFile: yaml_config/patch-external-secrets.yaml