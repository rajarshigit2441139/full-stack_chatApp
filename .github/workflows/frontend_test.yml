name: Frontend Test

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_test.yml"
    branches-ignore:
        - "main"
  workflow_call:
    inputs:
      node_version:
        type: number
        description: "Node.js version"
        required: false
        default: 24

  workflow_dispatch:
    inputs:
      node_version:
        type: number
        description: "Node.js version"
        required: false
        default: 24


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  set_default_node:
        runs-on: ubuntu-latest
        outputs:
            NODE_DEFAULT_VERSION: ${{ steps.set-node.outputs.NODE_DEFAULT_VERSION }}
        steps:
            - name: Set default Name
              id: set-node
              run: |
                echo "NODE_DEFAULT_VERSION=24" >> $GITHUB_OUTPUT
  test:
    runs-on: ubuntu-latest
    needs: set_default_node
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ fromJSON(inputs.node_version || needs.set_default_node.outputs.NODE_DEFAULT_VERSION) }}
            cache: "npm"
            cache-dependency-path: frontend/package-lock.json

        - name: Sync package-lock.json
          working-directory: frontend
          run: npm install --package-lock-only

        - name: Install dependencies
          working-directory: frontend
          run: |
            npm ci

        - name: Run tests with coverage
          working-directory: frontend
          run: |
            npm run test:coverage

        - name: Upload coverage report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: frontend-coverage
            path: frontend/coverage/
            retention-days: 2